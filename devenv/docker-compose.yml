name: "memoh-dev"
services:
  postgres:
    image: postgres:18-alpine
    container_name: memoh-dev-postgres
    environment:
      POSTGRES_DB: memoh
      POSTGRES_USER: memoh
      POSTGRES_PASSWORD: memoh123
      TZ: "${MEMOH_DEV_TZ:-UTC}"
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${MEMOH_DEV_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoh"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg18
    container_name: memoh-dev-pgvector
    environment:
      POSTGRES_DB: memoh_vector
      POSTGRES_USER: memoh
      POSTGRES_PASSWORD: memoh123
    volumes:
      - pgvector_data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${MEMOH_DEV_PGVECTOR_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoh -d memoh_vector"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  deps:
    build:
      context: ..
      dockerfile: devenv/Dockerfile.web
    container_name: memoh-dev-deps
    working_dir: /workspace
    command: ["pnpm", "install"]
    environment:
      CI: "true"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Keep the pnpm store on the SAME filesystem as node_modules (both live in
      # the node_modules volume). With the store elsewhere — a separate volume or
      # pnpm's cross-device fallback to <repo>/.pnpm-store on the bind mount —
      # hardlinking is impossible and the store is shared with the host's pnpm,
      # which is how a corrupted materialization of a patched dependency got
      # cached under a valid patch-hash name and was then reused forever.
      # Inside the volume it is container-only and dies with `docker volume rm`.
      npm_config_store_dir: /workspace/node_modules/.pnpm-store
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
    restart: "no"

  migrate:
    build:
      context: ..
      dockerfile: devenv/Dockerfile.server
    container_name: memoh-dev-migrate
    working_dir: /workspace
    entrypoint: []
    command: ["go", "run", "./cmd/agent", "migrate", "up"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONFIG_PATH: /workspace/devenv/app.dev.toml
      GOFLAGS: -buildvcs=false
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,pgvector,server,web,migrate,deps,webhook-tunnel,memoh-dev-postgres,memoh-dev-pgvector,memoh-dev-server,memoh-dev-web,memoh-dev-migrate,memoh-dev-deps,memoh-dev-webhook-tunnel"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,pgvector,server,web,migrate,deps,webhook-tunnel,memoh-dev-postgres,memoh-dev-pgvector,memoh-dev-server,memoh-dev-web,memoh-dev-migrate,memoh-dev-deps,memoh-dev-webhook-tunnel"
    volumes:
      - ..:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Connect-It owns the connect_it schema and creates it on startup; it only
  # needs postgres, never Memoh's migrations.
  connect-it:
    image: "${MEMOH_DEV_CONNECT_IT_IMAGE:-ghcr.io/felinics/connect-it:0.3.0}"
    container_name: memoh-dev-connect-it
    environment:
      DATABASE_URL: "postgres://memoh:memoh123@postgres:5432/memoh?sslmode=disable&search_path=connect_it"
      CONNECT_IT_BOOTSTRAP_API_TOKEN: "${MEMOH_CONNECT_IT_API_TOKEN:-}"
      CONNECT_IT_SECRET_KEY: "${MEMOH_DEV_CONNECT_IT_SECRET_KEY:-1:1111111111111111111111111111111111111111111111111111111111111111}"
      COOKIE_SECRET: "${MEMOH_DEV_CONNECT_IT_COOKIE_SECRET:-memoh-connect-it-dev-cookie-secret}"
      CONNECT_IT_ADMIN_PASSWORD: "${MEMOH_DEV_CONNECT_IT_ADMIN_PASSWORD:-admin123}"
      CONNECT_IT_BASE_URL: "${MEMOH_DEV_CONNECT_IT_BASE_URL:-http://localhost:18421}"
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,server,connect-it,memoh-dev-postgres,memoh-dev-server,memoh-dev-connect-it"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,server,connect-it,memoh-dev-postgres,memoh-dev-server,memoh-dev-connect-it"
    ports:
      # Loopback only: the dev stack ships a publicly-known bootstrap API
      # token, and real third-party credentials live behind this port.
      - "127.0.0.1:${MEMOH_DEV_CONNECT_IT_PORT:-18421}:8421"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: devenv/Dockerfile.server
    container_name: memoh-dev-server
    working_dir: /workspace
    privileged: true
    pid: host
    # Mirror production's memory ceiling (CM-PRC-001) so unbounded-context
    # regressions surface in dev instead of only under the production limit.
    mem_limit: ${MEMOH_DEV_SERVER_MEMORY_LIMIT:-8g}
    command: ["air", "-c", ".air.toml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONFIG_PATH: /workspace/devenv/app.dev.toml
      GOMEMLIMIT: "${MEMOH_DEV_SERVER_GOMEMLIMIT:-7GiB}"
      GOFLAGS: -buildvcs=false
      TZ: "${MEMOH_DEV_TZ:-UTC}"
      # Entrypoint only: which ref the workspace archive carries, so it can tell
      # whether containerd already holds it and skip the ~1GB re-import.
      MEMOH_DEV_WORKSPACE_IMAGE: "${MEMOH_DEV_WORKSPACE_IMAGE:-memohai/workspace:debian}"
      MEMOH_CONNECT_IT_BASE_URL: "${MEMOH_CONNECT_IT_BASE_URL:-}"
      MEMOH_CONNECT_IT_API_TOKEN: "${MEMOH_CONNECT_IT_API_TOKEN:-}"
      # Proxy: use host.docker.internal for localhost proxies, e.g.
      #   HTTP_PROXY=http://host.docker.internal:7890 mise run dev
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,pgvector,server,web,migrate,deps,connect-it,webhook-tunnel,memoh-dev-postgres,memoh-dev-pgvector,memoh-dev-server,memoh-dev-web,memoh-dev-migrate,memoh-dev-deps,memoh-dev-connect-it,memoh-dev-webhook-tunnel"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,pgvector,server,web,migrate,deps,connect-it,webhook-tunnel,memoh-dev-postgres,memoh-dev-pgvector,memoh-dev-server,memoh-dev-web,memoh-dev-migrate,memoh-dev-deps,memoh-dev-connect-it,memoh-dev-webhook-tunnel"
      MEMOH_DISPLAY_WEBRTC_UDP_PORT_MIN: "${MEMOH_DEV_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}"
      MEMOH_DISPLAY_WEBRTC_UDP_PORT_MAX: "${MEMOH_DEV_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}"
    volumes:
      - ..:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - containerd_data:/var/lib/containerd
      - server_cni_state:/var/lib/cni
      - memoh_data:/opt/memoh/data
      # Expose host CDI specs to the nested containerd used for bot workspaces.
      - /etc/cdi:/etc/cdi:ro
      - /var/run/cdi:/var/run/cdi:ro
      - ../.cache/memoh/workspace-debian.tar:/opt/memoh/dev-images/workspace-debian.tar:ro
    ports:
      - "${MEMOH_DEV_SERVER_PORT:-18080}:8080"
      - "${MEMOH_DEV_OAUTH_PORT:-1455}:8080"
      - "${MEMOH_DEV_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}-${MEMOH_DEV_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}:${MEMOH_DEV_DISPLAY_WEBRTC_UDP_PORT_MIN:-30000}-${MEMOH_DEV_DISPLAY_WEBRTC_UDP_PORT_MAX:-30100}/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgvector:
        condition: service_healthy
    restart: unless-stopped

  channel:
    build:
      context: ..
      dockerfile: devenv/Dockerfile.server
    container_name: memoh-dev-channel
    working_dir: /workspace
    entrypoint: []
    command: ["go", "run", "./cmd/channel", "serve"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONFIG_PATH: /workspace/devenv/app.dev.toml
      GOFLAGS: -buildvcs=false
      TZ: "${MEMOH_DEV_TZ:-UTC}"
      # The channel process makes the outbound platform connections
      # (Telegram, Discord, ...), so it needs the same proxy plumbing as
      # the server.
      HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
      HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,pgvector,server,channel,web,migrate,deps,webhook-tunnel,memoh-dev-postgres,memoh-dev-pgvector,memoh-dev-server,memoh-dev-channel,memoh-dev-web,memoh-dev-migrate,memoh-dev-deps,memoh-dev-webhook-tunnel"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      no_proxy: "${no_proxy:-${NO_PROXY:-127.0.0.1,localhost}},postgres,pgvector,server,channel,web,migrate,deps,webhook-tunnel,memoh-dev-postgres,memoh-dev-pgvector,memoh-dev-server,memoh-dev-channel,memoh-dev-web,memoh-dev-migrate,memoh-dev-deps,memoh-dev-webhook-tunnel"
    volumes:
      - ..:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - memoh_data:/opt/memoh/data
    ports:
      - "${MEMOH_DEV_CHANNEL_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Wait for the server so inbound platform messages arriving in the
      # startup window do not fail their turn RPC.
      server:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: devenv/Dockerfile.web
    container_name: memoh-dev-web
    working_dir: /workspace/apps/web
    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0", "--port", "8082"]
    environment:
      # Same store as the deps service: any `pnpm install` run inside this
      # container (debugging, one-off upgrades) must NOT fall back to the
      # default store logic, or it re-creates the host-shared repo-root store
      # this env var exists to eliminate.
      npm_config_store_dir: /workspace/node_modules/.pnpm-store
      MEMOH_CONFIG_PATH: /workspace/devenv/app.dev.toml
      MEMOH_WEB_PROXY_TARGET: http://server:8080
      MEMOH_CHANNEL_PROXY_TARGET: http://channel:8081
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "${MEMOH_DEV_WEB_PORT:-18082}:8082"
    depends_on:
      deps:
        condition: service_completed_successfully
      server:
        condition: service_healthy
      channel:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgvector_data:
    driver: local
  go_mod_cache:
    driver: local
  go_build_cache:
    driver: local
  containerd_data:
    driver: local
  memoh_data:
    driver: local
  server_cni_state:
    driver: local
  node_modules:
    driver: local
