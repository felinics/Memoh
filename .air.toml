root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/memoh-server ./cmd/agent && sh devenv/bridge-build.sh"
bin = "./tmp/memoh-server"
args_bin = ["serve"]
include_ext = ["go", "toml", "md", "json"]
include_dir = ["cmd", "internal", "conf", "templates"]
exclude_dir = ["tmp", "vendor", "node_modules", "packages", "apps", "docs", "devenv", "docker", "scripts", "db/postgres/migrations"]
exclude_regex = ["_test\\.go$"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 30000

[log]
time = false
main_only = true

[misc]
clean_on_exit = true
