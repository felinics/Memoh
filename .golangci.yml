version: "2"

run:
  timeout: 15m
  go: "1.25"
  tests: true

output:
  show-stats: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errcheck
    - errorlint
    - exptostd
    - fatcontext
    - gocritic
    - gosec
    - godot
    - govet
    - ineffassign
    - misspell
    - noctx
    - nilnesserr
    - perfsprint
    - predeclared
    - revive
    - sqlclosecheck
    - sloglint
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usestdlibvars
    - whitespace
  exclusions:
    generated: lax
    paths:
      - internal/db/postgres/sqlc
      - ^.*\.(pb|l|y)\.go$
    rules:
      # Process entry points and wiring: startup, shutdown and serve loops
      # are not units of work (docs/errors.md, Result records).
      - { path: '^cmd/', linters: [gocritic], text: RG-ATTR }
      # Packages not yet migrated to errlog. Delete a package's line once its
      # errors reach logs only through errlog.Finish and errlog.Event.
      - { path: '^internal/agent/', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/accounts/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/apps/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/botbackup/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/bots/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/dingtalk/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/feishu/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/feishu/wsclient/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/matrix/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/misskey/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/qq/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/slack/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/telegram/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/wecom/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/adapters/weixin/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/discuss/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/inbound/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/channel/route/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/chat/message/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/chat/thread/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/chat/timeline/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/command/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/connectors/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/container/docker/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/contextview/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/display/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/fetchproviders/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/handlers/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/healthcheck/checkers/mcp/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/hooks/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/mcp/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/mcp/sources/federation/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/memory/adapters/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/memory/adapters/builtin/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/memory/storefs/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/messageconv/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/models/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/network/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/oauthclients/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/providers/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/registry/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/schedule/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/searchproviders/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/webhooktunnel/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/workspace/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
      - { path: '^internal/workspacedeps/[^/]+\.go$', linters: [gocritic], text: RG-ATTR }
  settings:
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: "${base-path}/tools/ruleguard/rules.go"
          failOn: all
    depguard:
      rules:
        # Packages that return package errors. The public error is chosen by
        # the translation function of the caller, see docs/errors.md.
        package-errors:
          files:
            - "**/internal/agent/runtime/acp/**"
            - "**/internal/agent/runtime/claudecode/**"
            - "**/internal/agent/runtime/codex/**"
            - "**/internal/agent/runtime/external/**"
            - "**/internal/agent/runtime/native/**"
            - "**/internal/agent/runtime/toolmount/**"
            - "**/internal/models/**"
            - "**/internal/providers/**"
            - "**/internal/providertemplates/**"
            - "**/internal/searchproviders/**"
            - "**/internal/supermarket/**"
          deny:
            - pkg: github.com/felinics/memoh/internal/apperror
              desc: return a package error; the caller's translation function chooses the public error (docs/errors.md)
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    gocyclo:
      min-complexity: 10
    funlen:
      lines: 60
      statements: 30
    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: false
    revive:
      rules:
        - name: blank-imports
        - name: comment-spacings
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,testing.TB"
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-declaration
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
    sloglint:
      attr-only: true
      no-global: default
      static-msg: true
      key-naming-case: snake
      forbidden-keys: [time, level, msg, source]
    testifylint:
      enable-all: true
      disable:
        - float-compare
        - go-require

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/felinics/memoh)
    gofumpt:
      extra-rules: false
    goimports:
      local-prefixes:
        - github.com/felinics/memoh
