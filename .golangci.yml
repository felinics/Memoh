version: "2"

run:
  timeout: 15m
  go: "1.25"
  tests: true

output:
  show-stats: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - exptostd
    - fatcontext
    - gocritic
    - gosec
    - godot
    - govet
    - ineffassign
    - misspell
    - noctx
    - nilnesserr
    - perfsprint
    - predeclared
    - revive
    - sqlclosecheck
    - sloglint
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usestdlibvars
    - whitespace
  exclusions:
    generated: lax
    paths:
      - internal/db/postgres/sqlc
      - ^.*\.(pb|l|y)\.go$
    rules:
      # gosec's credential/taint heuristics fire on test fixtures: model IDs
      # that look like keys, throwaway API keys for an httptest server, and
      # paths the test itself built from t.TempDir(). Scoping the exemption to
      # _test.go keeps it off production code.
      - path: _test\.go$
        linters:
          - gosec
      # An external test package (package foo_test) dot-importing the package
      # under test is the one dot-import Go style endorses: it lets the test
      # exercise the API exactly as a caller writes it.
      - path: _test\.go$
        text: 'dot-imports: should not use dot imports'
        linters:
          - revive
      # An embedded interface in a test stub is how the stub satisfies that
      # interface without implementing every method; `unused` reads the
      # embedded name as a dead field.
      - path: _test\.go$
        text: 'field queries is unused'
        linters:
          - unused
      # cmd/agent has two build profiles (embedded vs //go:build split) whose FX
      # providers are each referenced by exactly one profile. A single-tag lint
      # pass always sees the other profile's providers as dead. `mise run
      # lint:go:split` covers the split side, so a provider dead in BOTH
      # profiles still gets caught.
      - path: ^cmd/agent/
        linters:
          - unused
  settings:
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    gocyclo:
      min-complexity: 10
    funlen:
      lines: 60
      statements: 30
    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: false
    revive:
      rules:
        - name: blank-imports
        - name: comment-spacings
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,testing.TB"
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-declaration
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
    sloglint:
      attr-only: true
      no-global: default
      context: scope
      static-msg: true
      key-naming-case: snake
      forbidden-keys: [time, level, msg, source]
    testifylint:
      enable-all: true
      disable:
        - float-compare
        - go-require

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/memohai/memoh)
    gofumpt:
      extra-rules: false
    goimports:
      local-prefixes:
        - github.com/memohai/memoh
