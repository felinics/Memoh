<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memoh 上滑动效预览（本地样例）</title><style>body{margin:0}#app{height:100vh}.viewport{height:100%;overflow:auto}.column{max-width:760px;margin:auto;padding:24px 24px 160px}.turn+.turn{margin-top:24px}.prompt{display:flex;justify-content:flex-end}.bubble{max-width:70%;padding:12px 16px;border-radius:16px;background:var(--chat-user-bubble);color:var(--chat-user-bubble-fg)}.reply{margin-top:24px}form{position:fixed;bottom:24px;left:15%;right:15%;display:flex;gap:12px;background:var(--background);padding:12px;border:1px solid var(--border)}form.welcome{bottom:auto;top:35%}input{flex:1;min-width:0;background:var(--muted);padding:12px;color:var(--foreground)}button{padding:12px}</style></head><body><div id="app"></div><script type="module">
import '/src/style.css';
import {createApp,h,ref,nextTick,computed} from 'vue';
import {useChatScroll} from '/src/pages/home/composables/useChatScroll.ts';
import {useComposerPlacementMotion} from '/src/pages/home/composables/useComposerPlacementMotion.ts';
createApp({setup(){const scrollEl=ref(null),contentEl=ref(null),lastTurnEl=ref(null),messages=ref([]),active=ref(true),sessionId=ref('qa'),input=ref('试一下从下面滑上来（本地样例）');const composer=ref(null),welcome=computed(()=>messages.value.length===0);useComposerPlacementMotion(composer,welcome);const scroll=useChatScroll({scrollEl,contentEl,lastTurnEl,messages,isActive:active,sessionId});scroll.lockScroll.value=false;let id=0;const send=async e=>{e?.preventDefault();scroll.pinAfterSend();messages.value.push({id:String(++id),role:'user',text:input.value,isSelf:true,attachments:[],timestamp:new Date().toISOString(),streaming:false});input.value='再发一条';await nextTick();window.framesQA=[];const sample=()=>{const p=lastTurnEl.value.querySelector('.prompt'),r=lastTurnEl.value.querySelector('.reply');window.framesQA.push({time:performance.now(),top:p.getBoundingClientRect().top,gap:r.getBoundingClientRect().top-p.getBoundingClientRect().bottom,scrollTop:scrollEl.value.scrollTop,scrollHeight:scrollEl.value.scrollHeight,transform:lastTurnEl.value.querySelector('[data-turn-motion]').style.transform});if(window.framesQA.length<50)requestAnimationFrame(sample)};requestAnimationFrame(sample)};window.motionQA={send,scroll,messages,sessionId,active};return()=>h('div',{style:'height:100%'},[h('div',{class:'viewport',ref:scrollEl},h('div',{class:'column',ref:contentEl},messages.value.map((m,i)=>h('div',{'data-chat-turn':'',class:'turn',key:m.id,ref:i===messages.value.length-1?el=>lastTurnEl.value=el:undefined,style:scroll.turnReserveStyle(m.id)},h('div',{'data-turn-motion':''},[h('div',{'data-message-id':m.id,class:'prompt'},h('div',{class:'bubble'},m.text)),h('div',{class:'reply'},'这是本地渲染样本，用于检查正文间距和滚动位置。\n'.repeat(12))]))))),h('form',{ref:composer,class:{welcome:welcome.value},onSubmit:send},[h('input',{'aria-label':'预览消息',value:input.value,onInput:e=>input.value=e.target.value}),h('button',{type:'submit'},'发送')])])}}).mount('#app');
</script></body></html>
