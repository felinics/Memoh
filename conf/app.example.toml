# Memoh configuration template
# Copy to config.toml and adjust values for your environment.
# For local development, use: cp devenv/app.dev.toml config.toml

timezone = "UTC"

# Instance identity used by bridge mTLS strict mode.
# Leave empty unless [bridge_tls].mode = "strict".
instance_id = ""

[log]
level = "info"
format = "text"

[server]
addr = ":8080"
rpc_listen_addr = "127.0.0.1:9090"

[channel]
addr = ":8081"
rpc_listen_addr = "127.0.0.1:9091"

[internal_rpc]
# Leave shared_secret empty to run the pre-split all-in-one deployment: the
# server embeds the channel runtime (external channels, email, webhooks) and
# no memoh-channel process or internal RPC is needed.
# Set a secret (e.g. `openssl rand -hex 32`) to split the channel runtime
# into its own memoh-channel process; the internal RPC is plaintext, so keep
# the listeners loopback-only unless the link is otherwise protected.
server_target = "127.0.0.1:9090"
channel_target = "127.0.0.1:9091"
# May also be set with MEMOH_INTERNAL_RPC_SHARED_SECRET.
shared_secret = ""

[webhook_tunnel]
# Optional Cloudflare Quick Tunnel support for local webhook testing.
# disabled: no tunnel. managed: the Channel service starts cloudflared. external: read
# an already-running cloudflared metrics endpoint, useful for Docker sidecars.
mode = "disabled"
# Public HTTPS base used for channel webhook callbacks and signed public media
# URLs. Set this to a public HTTPS origin without a path or port when Memoh is
# already reachable via your own domain; leave empty to use the Cloudflare Quick
# Tunnel URL when tunnel mode is enabled.
public_base_url = ""
# Webhook-only listener used by managed/external tunnel mode. It exposes only
# /health, /channels/:platform/webhook/:config_id, and signed channel public
# media URLs.
listen_addr = "127.0.0.1:18734"
# Path to cloudflared for managed mode. Empty means PATH lookup.
cloudflared_path = ""
# Local URL cloudflared forwards to. Empty derives from listen_addr.
target_url = ""
# Local cloudflared metrics address for managed mode.
metrics_addr = "127.0.0.1:18735"
# Existing cloudflared metrics URL for external mode.
metrics_url = ""

[admin]
username = "admin"
password = "admin123"
email = "admin@memoh.local"

[auth]
jwt_secret = "CHANGE-ME-TO-A-RANDOM-SECRET"
jwt_expires_in = "168h"

[agent]
tool_output_max_bytes = 65536
tool_output_max_lines = 2000
system_files_max_bytes = 32768
# In-loop context step reselector rollout mode: active | shadow | off.
# active runs the reselector and applies its result (default). shadow runs
# it for observability only and never touches the payload. off skips it
# entirely, keeping only legacy mid-task pruning.
# context_loop_reselect = "active"
# Server-wide context admission cap in estimated tokens. The effective
# per-turn budget is min(model context window, this cap); when the model has
# no configured context window the cap alone bounds the context. Raise it for
# models with windows above the default; it can never be disabled.
# context_absolute_max_tokens = 200000

[session_runtime]
# Stores live run snapshots for WebSocket attach/reconnect. memory is best for
# single-server deployments. redis uses the Redis protocol and works with
# Redis or Valkey servers to share state and commands across servers.
backend = "memory"
state_ttl = "24h"
# How long a run owner may go silent before another server may take the run
# over. It also paces the reaper and defines how long an unclaimed admission
# waits before it is given up on, so it applies to both backends.
owner_lease_ttl = "30s"
# Declare a multi-server deployment. Startup refuses cluster = true with
# backend = "memory", because two servers cannot arbitrate ownership through a
# per-process heap.
cluster = false
# How long to wait after the live backend is replaced (a Redis or Valkey
# restart or failover) before in-flight runs are recorded as lost. Defaults to
# 3 x owner_lease_ttl and must not be shorter than owner_lease_ttl.
# backend_loss_grace = "90s"

[session_runtime.redis]
# Redis or Valkey server URL. Keep the redis:// scheme.
url = "redis://127.0.0.1:6379/0"
key_prefix = "memoh:session_runtime:"

[database]
# Memoh now supports PostgreSQL only.
driver = "postgres"

[container]
# Required. Select the workspace runtime backend.
# - containerd: direct containerd integration with CNI and snapshot support.
# - docker: host Docker Engine API, best for host/binary deployments where
#   workspace bind-mount source paths are valid on the Docker host.
# - apple: macOS Apple Container backend via socktainer.
backend = "docker"
# registry = "memoh.cn"  # Uncomment for China mainland mirror
default_image = "memohai/workspace:debian"
# Workspace image pull policy: if_not_present, always, or never.
# The selected container backend applies it before creating the workspace.
image_pull_policy = "if_not_present"
# containerd snapshotter name. Ignored by the Docker backend.
snapshotter = "overlayfs"
# Host/runtime data root for sockets, CNI state, overlay sidecars, and workspace metadata.
data_root = "data"
# Host path to the bridge binary mounted read-only into workspace containers.
bridge_path = "/opt/memoh/runtime/bridge"
# CNI paths used by containerd-backed runtime networking.
cni_bin_dir = "/opt/cni/bin"
cni_conf_dir = "/etc/cni/net.d"

[containerd]
# Used when [container].backend = "containerd". The Docker Compose deployment
# starts an embedded containerd inside the server container at this socket.
socket_path = "/run/containerd/containerd.sock"
namespace = "default"

[docker]
# Used when [container].backend = "docker".
# Leave empty to use Docker's standard environment discovery (DOCKER_HOST,
# DOCKER_TLS_VERIFY, DOCKER_CERT_PATH, or the platform default socket).
host = ""

[bridge_tls]
# disabled: default for local/open-source deployments.
# strict: TCP workspace bridge requires mTLS. UDS workspace bridges keep using
# their socket trust model.
# Generate material with:
#   scripts/gen-bridge-mtls.sh -instance-id <uuid> -out /opt/memoh/bridge-mtls
mode = "disabled"
# Directory readable by the Memoh server process. It must contain:
# server-client.crt, server-client.key, bridge-server-ca.crt.
server_dir = ""
# Directory mounted read-only into workspace containers. It must contain only
# bridge-server.crt, bridge-server.key, server-client-ca.crt. Strict mode
# rejects unexpected files here. Do not point this at server_dir, because
# server_dir contains the Memoh server client key.
bridge_dir = ""
# Optional synthetic TLS ServerName. Empty derives
# memoh-bridge.<instance_id>.bridge.memoh.internal.
server_name = ""

[apple]
# Used when [container].backend = "apple". Leave empty to use socktainer defaults.
# socket_path = "/path/to/your/.socktainer/container.sock"
# binary_path = "/opt/homebrew/bin/socktainer"
socket_path = ""
binary_path = ""

[postgres]
host = "127.0.0.1"
port = 5432
user = "memoh"
password = "memoh123"
database = "memoh"
sslmode = "disable"

## pgvector auxiliary index database (optional). When enabled, Memoh maintains
## a semantic seed vector index in a separate Postgres + pgvector service.
[pgvector]
enabled = false
host = "127.0.0.1"
port = 5432
user = "memoh"
password = ""
database = "memoh_vector"
sslmode = "disable"

[registry]
providers_dir = "conf/providers"

[supermarket]
base_url = "https://supermarket.memoh.ai"

[connect_it]
# Trusted server-to-server credential. Prefer the matching environment
# variables in deployed environments.
base_url = ""
api_token = ""

[oauth_clients]
config_path = "conf/oauth-clients.toml"

[web]
host = "127.0.0.1"
port = 8082
