name: Groq
client_type: openai-completions
icon: groq
base_url: https://api.groq.com/openai/v1

# Groq production model catalog as of 2026-09-15.
models:
  - model_id: groq/compound
    name: Groq Compound
    type: chat
    config:
      compatibilities: [tool-call]
      context_window: 131072

  - model_id: groq/compound-mini
    name: Groq Compound Mini
    type: chat
    config:
      compatibilities: [tool-call]
      context_window: 131072

  - model_id: openai/gpt-oss-120b
    name: GPT OSS 120B
    type: chat
    config:
      compatibilities: [tool-call, reasoning]
      context_window: 131072

  - model_id: openai/gpt-oss-20b
    name: GPT OSS 20B
    type: chat
    config:
      compatibilities: [tool-call, reasoning]
      context_window: 131072

  # Non-deprecated preview models are kept available for evaluation; Groq
  # warns that preview models can be discontinued at short notice.
  - model_id: minimaxai/minimax-m2.7
    name: MiniMax M2.7
    type: chat
    config:
      compatibilities: [tool-call, reasoning]
      context_window: 196608

  - model_id: qwen/qwen3.8-27b
    name: Qwen3.8 27B
    type: chat
    config:
      compatibilities: [tool-call, reasoning]
      context_window: 131072

  - model_id: openai/gpt-oss-safeguard-20b
    name: GPT OSS Safeguard 20B
    type: chat
    config:
      compatibilities: [reasoning]
      context_window: 131072
