name: OpenAI
client_type: openai-responses
icon: openai
base_url: https://api.openai.com/v1

# Curated from OpenAI's current API model catalog on 2026-09-15.
# Account-specific models can still be imported from the live /models endpoint.
models:
  - model_id: gpt-6-astra
    name: GPT-6 Astra
    type: chat
    config:
      description: OpenAI flagship for complex reasoning, coding, computer use, and research.
      compatibilities: [vision, file-input, tool-call, reasoning]
      context_window: 1050000
      thinking_mode: toggle
      reasoning_efforts: [low, medium, high, xhigh, max]

  - model_id: gpt-5.6-sol
    name: GPT-5.6 Sol
    type: chat
    config:
      description: OpenAI flagship for complex professional work.
      compatibilities: [vision, file-input, tool-call, reasoning]
      context_window: 1050000
      thinking_mode: toggle
      reasoning_efforts: [disable, low, medium, high, xhigh, max]

  - model_id: gpt-5.6-terra
    name: GPT-5.6 Terra
    type: chat
    config:
      description: OpenAI model balancing intelligence and cost.
      compatibilities: [vision, file-input, tool-call, reasoning]
      context_window: 1050000
      thinking_mode: toggle
      reasoning_efforts: [disable, low, medium, high, xhigh, max]

  - model_id: gpt-5.6-luna
    name: GPT-5.6 Luna
    type: chat
    config:
      description: OpenAI model optimized for cost-sensitive, high-volume workloads.
      compatibilities: [vision, file-input, tool-call, reasoning]
      context_window: 1050000
      thinking_mode: toggle
      reasoning_efforts: [disable, low, medium, high, xhigh, max]

  - model_id: text-embedding-3-large
    name: Text Embedding 3 Large
    type: embedding
    config:
      dimensions: 3072

  - model_id: text-embedding-3-small
    name: Text Embedding 3 Small
    type: embedding
    config:
      dimensions: 1536
