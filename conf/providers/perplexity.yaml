name: "Perplexity"
client_type: openai-completions
icon: "perplexity-color"
base_url: "https://api.perplexity.ai"

# Current Sonar API models from Perplexity's model guide, newest first.
models:
  - model_id: "sonar-deep-research"
    name: "Sonar Deep Research"
    type: chat
    config:
      compatibilities: [reasoning]
      context_window: 128000
      thinking_mode: toggle
      reasoning_efforts: [low, medium, high]

  - model_id: "sonar-reasoning-pro"
    name: "Sonar Reasoning Pro"
    type: chat
    config:
      compatibilities: [reasoning]
      context_window: 128000
      thinking_mode: toggle
      reasoning_efforts: [low, medium, high]

  - model_id: "sonar-reasoning"
    name: "Sonar Reasoning"
    type: chat
    config:
      compatibilities: [reasoning]
      context_window: 128000
      thinking_mode: toggle
      reasoning_efforts: [low, medium, high]

  - model_id: "sonar-pro"
    name: "Sonar Pro"
    type: chat
    config:
      context_window: 200000

  - model_id: "sonar"
    name: "Sonar"
    type: chat
    config:
      context_window: 128000
