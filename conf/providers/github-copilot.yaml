name: GitHub Copilot
client_type: github-copilot
icon: github-copilot

# GitHub Copilot's catalog is managed by OAuth and the Copilot service; it
# intentionally has no user-configurable base_url. These are the current GA
# models listed in GitHub's supported-models table, newest first.
models:
  - model_id: gpt-6-astra
    name: GPT-6 Astra
    type: chat
    config:
      context_window: 1000000
      compatibilities: [vision, tool-call, reasoning]
      reasoning_efforts: [low, medium, high, xhigh]

