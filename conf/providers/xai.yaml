name: xAI Grok
client_type: openai-responses
icon: xai
base_url: https://api.x.ai/v1

# Current xAI API models as of 2026-09-15.
models:
  - model_id: grok-4.6
    name: Grok 4.6
    type: chat
    config:
      compatibilities: [vision, tool-call, reasoning]
      context_window: 500000
      thinking_mode: toggle
      reasoning_efforts: [low, medium, high]

  - model_id: grok-4.5
    name: Grok 4.5
    type: chat
    config:
      compatibilities: [vision, tool-call, reasoning]
      context_window: 500000

  - model_id: grok-4.3
    name: Grok 4.3
    type: chat
    config:
      compatibilities: [vision, tool-call, reasoning]
      context_window: 1000000

  - model_id: grok-4.20-multi-agent-0309
    name: Grok 4.20 Multi-Agent
    type: chat
    config:
      compatibilities: [vision, tool-call, reasoning]
      context_window: 1000000
      thinking_mode: toggle
      reasoning_efforts: [low, medium, high]

  - model_id: grok-4.20-0309-reasoning
    name: Grok 4.20 Reasoning
    type: chat
    config:
      compatibilities: [vision, tool-call, reasoning]
      context_window: 1000000
      thinking_mode: toggle
      reasoning_efforts: [low, medium, high]

  - model_id: grok-4.20-0309-non-reasoning
