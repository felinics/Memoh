name: DeepSeek
client_type: openai-completions
icon: deepseek-color
base_url: https://api.deepseek.com/v1
config:
  chat_completions_compat: deepseek

# Current DeepSeek API models as of 2026-09-15. The legacy V4 Flash IDs
# are retired; use deepseek-flash for the current V4.1 Flash service.
models:
  - model_id: deepseek-flash
    name: DeepSeek V4.1 Flash
    type: chat
    config:
      compatibilities: [tool-call, reasoning]
      context_window: 1000000
      thinking_mode: toggle
      reasoning_efforts: [disable, low, medium, high]

  - model_id: deepseek-v4-pro
    name: DeepSeek V4 Pro
    type: chat
    config:
      compatibilities: [tool-call, reasoning]
      context_window: 1000000
      thinking_mode: toggle
      reasoning_efforts: [disable, low, medium, high]
