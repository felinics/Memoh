name: Minimax
client_type: openai-completions
icon: minimax-color
base_url: https://api.minimaxi.com/v1
config:
  chat_completions_compat: minimax

# Current MiniMax text models from the OpenAI-compatible API catalog.
models:
  - model_id: MiniMax-M2.7
    name: MiniMax M2.7
    type: chat
    config:
      compatibilities: [tool-call, reasoning]
      context_window: 204800
      thinking_mode: always

  - model_id: MiniMax-M2.7-highspeed
    name: MiniMax M2.7 Highspeed
    type: chat
    config:
      compatibilities: [tool-call, reasoning]
      context_window: 204800
      thinking_mode: always

