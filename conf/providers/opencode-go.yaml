name: OpenCode Go
client_type: opencode-go
icon: opencode-go
base_url: https://opencode.ai/zen/go/v1

# Models: https://opencode.ai/docs/go/#endpoints, less time-limited free models;
# capabilities: models.dev (2026-09-30, 1a54bed6f00935e2d15ef08952bd911fcb98c262).
# Twilight routes these to their protocols; unlisted models use Completions.
# Keep provider-managed reasoning where the catalog exposes no controls.
# Budget-based models use Memoh's low/medium/high token allowances.
models:
  - model_id: grok-4.7
    name: Grok 4.7
    type: chat
    config:
      compatibilities: [vision, file-input, tool-call, reasoning]
      context_window: 500000
