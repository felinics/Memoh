name: OpenCode Go
client_type: opencode-go
base_url: https://opencode.ai/zen/go/v1

# Routes: Twilight OpenCode Go catalog; capabilities: models.dev (2026-09-18).
# Use provider-managed reasoning except for explicitly supported Go controls.
models:
  - model_id: grok-4.6
    name: Grok 4.6
    type: chat
    config:
      compatibilities: [vision, tool-call, reasoning]
      context_window: 500000
      thinking_mode: always

