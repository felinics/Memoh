name: Go CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "db/postgres/queries/**/*.sql"
      - "db/postgres/migrations/**/*.sql"
      - "db/pgvector/queries/**/*.sql"
      - "db/pgvector/migrations/**/*.sql"
      - "internal/workspacedeps/catalog/deps/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "db/postgres/queries/**/*.sql"
      - "db/postgres/migrations/**/*.sql"
      - "db/pgvector/queries/**/*.sql"
      - "db/pgvector/migrations/**/*.sql"
      - "internal/workspacedeps/catalog/deps/**"
      - ".github/workflows/go-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          only-new-issues: true
      - name: shellcheck workspace dependency scripts
        # Catalog scripts run inside workspaces as POSIX sh (design WD-CAT-003);
        # ubuntu-latest ships shellcheck.
        run: shellcheck -s sh internal/workspacedeps/catalog/deps/*/*.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.txt
          if-no-files-found: error

  pgvector-bootstrap:
    name: Pgvector bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pgvector:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: memoh_vector_test
          POSTGRES_USER: memoh
          POSTGRES_PASSWORD: memoh123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoh -d memoh_vector_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test versioned pgvector schema and queries
        env:
          TEST_PGVECTOR_DSN: postgres://memoh:memoh123@127.0.0.1:5432/memoh_vector_test?sslmode=disable
        run: go test -count=1 ./internal/db/pgvector ./internal/memory/adapters/builtin

  session-runtime-backend:
    name: Session Runtime (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Redis
            image: redis:8-alpine
            env_name: MEMOH_TEST_REDIS_URL
          - target: Valkey
            image: valkey/valkey:8-alpine
            env_name: MEMOH_TEST_VALKEY_URL
    services:
      runtime:
        image: ${{ matrix.image }}
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "sh -c 'redis-cli ping || valkey-cli ping'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run distributed session runtime contracts
        env:
          MEMOH_TEST_DISTRIBUTED_REQUIRED: "1"
          RUNTIME_URL: redis://127.0.0.1:${{ job.services.runtime.ports['6379'] }}/0
          RUNTIME_ENV_NAME: ${{ matrix.env_name }}
        run: env "$RUNTIME_ENV_NAME=$RUNTIME_URL" go test -v -race -count=1 -timeout 90s ./internal/agent/runtime/session

  session-runtime-postgres:
    name: Session Runtime (PostgreSQL fencing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: memoh_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d memoh_runtime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run durable runtime fencing contracts
        env:
          MEMOH_TEST_POSTGRES_REQUIRED: "1"
          TEST_POSTGRES_BOOTSTRAP_SCHEMA: "1"
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/memoh_runtime_test?sslmode=disable
        run: |
          go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgresRuntimeFence' ./internal/runtimefence
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgresRuntimeFence' ./internal/chat/message
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgresRuntimeFence' ./internal/agent/runtime/acp
