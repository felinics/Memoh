name: Contribution governance

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to inspect'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

# Coalesce rapid edits or pushes for the same issue/PR and cancel superseded runs.
concurrency:
  group: contribution-governance-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  govern:
    if: github.repository == 'felinics/Memoh' && (github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/github-script@v7
        with:
          retries: 2
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contribution-governance.mjs`);
            await run({ github, context, core });
