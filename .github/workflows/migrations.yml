name: Migrations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrations.yml"
      - "sqlc.yaml"
      - "db/**"
      - "internal/db/**"
      - "**/*postgres_integration_test.go"
      - "**/*integration_test.go"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/migrations.yml"
      - "sqlc.yaml"
      - "db/**"
      - "internal/db/**"
      - "**/*postgres_integration_test.go"
      - "**/*integration_test.go"

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL Epoch v2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: memoh_test
          POSTGRES_USER: memoh
          POSTGRES_PASSWORD: memoh123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Each owner generates from its own config, so verifying only one would
      # let the others drift.
      - name: Verify generated owner SQL is current
        run: |
          for config in db/postgres/*/sqlc.yaml sqlc.yaml; do
            echo "==> sqlc generate -f $config"
            go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f "$config"
          done
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'Regenerating SQL produced untracked files:\n%s\n' "$untracked"
            exit 1
          fi
          git diff --exit-code

      - name: Build server
        run: go build -o memoh-server ./cmd/agent

      - name: Generate config
        run: |
          cat > config.toml <<'TOML'
          [postgres]
          host = "127.0.0.1"
          port = 5432
          user = "memoh"
          password = "memoh123"
          database = "memoh_test"
          sslmode = "disable"
          TOML

      # Epoch v2 offers no "roll back every migration"; forward repair or
      # restore is the supported recovery path, so there is no down step here.
      - name: Fresh install
        run: |
          ./memoh-server migrate up
          ./memoh-server migrate up
          ./memoh-server migrate status
          ./memoh-server migrate verify

      # The upgrade path needs no provisioning here: the parity test builds its
      # own v1 source from the frozen snapshot in db/postgres/legacy/v1.
      #
      # Discovering the packages keeps this gate honest: a new integration test
      # is covered the moment it reads TEST_POSTGRES_DSN, instead of silently
      # skipping until someone remembers to list it here.
      - name: Integration tests against Epoch v2
        env:
          TEST_POSTGRES_DSN: postgres://memoh:memoh123@127.0.0.1:5432/memoh_test?sslmode=disable
        run: |
          packages="$(
            grep -rl --include='*_test.go' TEST_POSTGRES_DSN . \
              | xargs -n1 dirname | sort -u
          )"
          if [ -z "$packages" ]; then
            echo 'No package reads TEST_POSTGRES_DSN; the gate would silently pass.'
            exit 1
          fi
          printf 'Packages requiring PostgreSQL:\n%s\n' "$packages"
          printf '%s\n' "$packages" | xargs go test -tags=integration -count=1

      - name: Architecture guards
        run: go test -count=1 ./internal/arch
