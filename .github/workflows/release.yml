name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to rebuild, e.g. v0.7.0"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-bundle:
    name: Build complete source archives
    needs: changelog
    if: ${{ always() && (needs.changelog.result == 'success' || needs.changelog.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # workflow_dispatch runs the repaired workflow from main, but release
          # archives must remain reproducible from the requested release tag.
          ref: ${{ env.RELEASE_TAG }}
      - name: Package repository with submodules
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ROOT="Memoh-${VERSION}"
          STAGE="${RUNNER_TEMP}/${ROOT}"

          test -f packages/ui/package.json
          mkdir -p "$STAGE"
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            ./ "$STAGE/"

          tar -C "$RUNNER_TEMP" -czf "${RUNNER_TEMP}/${ROOT}-source.tar.gz" "$ROOT"
          (cd "$RUNNER_TEMP" && zip -qr "${ROOT}-source.zip" "$ROOT")
      - name: Upload complete source archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "${RUNNER_TEMP}/Memoh-${VERSION}-source.tar.gz" \
            "${RUNNER_TEMP}/Memoh-${VERSION}-source.zip" \
            --clobber

  # npm publish jobs authenticate via npm trusted publishing (OIDC), not token
  # secrets: each published package has felinics/Memoh + this release.yml
  # registered as its trusted publisher on npmjs.com, and pnpm exchanges the
  # GitHub OIDC token at publish time (requires id-token: write on the job).
  # The npm-side trusted publisher entry has NO environment name, so these jobs
  # must NOT declare an `environment:` — npm matches repo + workflow +
  # environment exactly, and a mismatch fails auth with an opaque 404.
  # If a package is ever added to the publish allowlist in
  # scripts/publish-packages.mjs, it must get the same trusted-publisher entry
  # on npmjs.com first, or its publish will fail. The old NPM_TOKEN /
  # FELINIC_NPM_TOKEN secrets are retired; scripts/publish-packages.mjs still
  # supports NODE_AUTH_TOKEN for local manual publishes.
  npm-publish-felinic:
    name: Publish @felinic/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Also runs on workflow_dispatch so a failed publish of an existing tag can
    # be retried; scripts/publish-packages.mjs skips already-published versions,
    # which keeps re-runs idempotent.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Release ownership note for future maintainers and agents:
      # packages/ui is a git submodule pinned by this repository, but Memoh
      # releases intentionally publish the pinned @felinic/ui sources together
      # with the rest of the Memoh npm workspace. In other words,
      # @felinic/ui@<Memoh version> means "the UI package content selected by
      # this Memoh release", not necessarily a matching tag in felinics/ui.
      #
      # Do not remove packages/ui from the version-sync or publish path just
      # because it is a submodule. If @felinic/ui ever moves to an independent
      # release cadence, update this workflow, scripts/publish-packages.mjs, and
      # the release handoff docs in the same PR so the ownership model stays
      # explicit.
      - name: Sync workspace versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export VERSION
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const targets = [
            'package.json',
            'packages/sdk/package.json',
            'packages/runtime/package.json',
            'packages/ui/package.json',
            'packages/icons/package.json',
            'packages/config/package.json',
            'apps/web/package.json',
            'apps/desktop/package.json',
          ];
          for (const target of targets) {
            if (!fs.existsSync(target)) continue;
            const pkg = JSON.parse(fs.readFileSync(target, 'utf8'));
            pkg.version = version;
            // npm provenance (auto-generated for trusted publishing) requires
            // repository.url to exactly match the repo the OIDC token is
            // minted for — always felinics/Memoh here. Stamp it at release time
            // so a missing/stale field can never fail the publish, and so
            // packages/ui (a submodule whose own repo is felinics/ui) gets the
            // Memoh URL, matching where the publish actually runs.
            const directory = target.replace(/\/package\.json$/, '');
            pkg.repository = {
              type: 'git',
              url: 'git+https://github.com/felinics/Memoh.git',
              ...(directory === 'package.json' || directory === '' ? {} : { directory }),
            };
            fs.writeFileSync(target, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          EOF
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish @felinic/ui
        env:
          NPM_PUBLISH_SCOPE: "@felinic"
        run: pnpm publish:npm

  npm-publish-memohai:
    name: Publish @memohai packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch allowed for the same retry reason as the felinic job.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sync workspace versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export VERSION
          node <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const targets = [
            'package.json',
            'packages/sdk/package.json',
            'packages/runtime/package.json',
            'packages/icons/package.json',
            'packages/config/package.json',
            'apps/web/package.json',
            'apps/desktop/package.json',
          ];
          for (const target of targets) {
            if (!fs.existsSync(target)) continue;
            const pkg = JSON.parse(fs.readFileSync(target, 'utf8'));
            pkg.version = version;
            // npm provenance (auto-generated for trusted publishing) requires
            // repository.url to exactly match the repo the OIDC token is
            // minted for — always felinics/Memoh here. Stamp it at release time
            // so a missing/stale field can never fail the publish, and so
            // packages/ui (a submodule whose own repo is felinics/ui) gets the
            // Memoh URL, matching where the publish actually runs.
            const directory = target.replace(/\/package\.json$/, '');
            pkg.repository = {
              type: 'git',
              url: 'git+https://github.com/felinics/Memoh.git',
              ...(directory === 'package.json' || directory === '' ? {} : { directory }),
            };
            fs.writeFileSync(target, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          EOF
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish @memohai packages
        env:
          NPM_PUBLISH_SCOPE: "@memohai"
        run: pnpm publish:npm
