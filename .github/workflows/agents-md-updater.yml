name: Update AGENTS.md
on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    uses: sheepbox8646/agents-md-updater/.github/workflows/update-agents-md.yml@main
    with:
      agent: claude
      target_files: AGENTS.md
      extra_instructions: |
        Preserve the contribution templates, automated label policy, screenshot evidence requirements,
        and human QA disclosure rules in AGENTS.md. Do not weaken these repository policies.
      pr_body: |
        ## Author
        - [x] Agent
        - [ ] Human

        ## Type
        - [ ] bug
        - [x] feat
        - [ ] test

        ## Summary
        Update the AGENTS.md development guide to reflect the current repository structure.

        ## Validation
        The workflow completed the documentation update. Product behavior was not tested; review the guide against the current code.

        ## Screenshots / Recordings
        This only changes developer documentation and has no visible product UI. Review the documentation diff for verification.

        ## Human QA
        - [ ] Human QA passed

    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  govern:
    if: github.repository == 'felinics/Memoh'
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/github-script@v7
        with:
          retries: 2
          script: |
            const { governBotPRs } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contribution-governance.mjs`);
            await governBotPRs({ github, context, core });
