name: ESLint

on:
  push:
    branches: ["main"]
    paths:
      - ".husky/**"
      - "scripts/hook-checks.test.mjs"
      - "scripts/display-prepare.sh"
      - "apps/**/*.js"
      - "apps/**/*.cjs"
      - "apps/**/*.mjs"
      - "apps/**/*.ts"
      - "apps/**/*.tsx"
      - "apps/**/*.vue"
      - "docker/**"
      - "packages/**"
      - "packages/**/*.js"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"
      - "packages/**/*.vue"
      - "scripts/**/*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/eslint.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".husky/**"
      - "scripts/hook-checks.test.mjs"
      - "scripts/display-prepare.sh"
      - "apps/**/*.js"
      - "apps/**/*.cjs"
      - "apps/**/*.mjs"
      - "apps/**/*.ts"
      - "apps/**/*.tsx"
      - "apps/**/*.vue"
      - "docker/**"
      - "packages/**"
      - "packages/**/*.js"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"
      - "packages/**/*.vue"
      - "scripts/**/*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/eslint.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: UI contract guard
        run: node scripts/check-ui-contract.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Settings row guard
        run: node scripts/check-settings-rows.mjs
      - name: Run ESLint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build runtime package
        # apps/desktop tests import @memohai/runtime, whose dist is not committed.
        run: pnpm --filter @memohai/runtime build
      - name: Test commit hook selection and execution
        run: node --test scripts/hook-checks.test.mjs
      - name: Test release scripts
        run: node --test scripts/publish-auth.test.mjs
      - name: Test display preparation lock recovery
        run: node --test scripts/display-prepare-lock.test.mjs
      - name: Test settings row guard
        run: node --test scripts/check-settings-rows.test.mjs
      - name: Run Vitest
        # Runs every project (web, desktop, runtime, docker). The timeout is generous
        # because a full run cold-loads every module on a small runner.
        run: pnpm test --run --testTimeout=60000
      - name: Typecheck SDK
        run: pnpm --filter @memohai/sdk typecheck
      - name: Typecheck Web
        run: pnpm --filter @memohai/web typecheck
      - name: Typecheck Desktop
        run: pnpm --filter @memohai/desktop typecheck
