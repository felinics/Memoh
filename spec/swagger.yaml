  workspace.WorkspaceTargetGrant:
    properties:
      bot_id:
        type: string
      primary:
        type: boolean
      runtime_id:
        type: string
      target_id:
        type: string
    type: object
  workspace.WorkspaceTargetGrantsResponse:
    properties:
      grants:
        items:
          $ref: '#/definitions/workspace.WorkspaceTargetGrant'
        type: array
    type: object
  workspace.WorkspaceTargetToolApproval:
    properties:
      exec:
        $ref: '#/definitions/settings.ToolApprovalMode'
      read:
        $ref: '#/definitions/settings.ToolApprovalMode'
      write:
        $ref: '#/definitions/settings.ToolApprovalMode'
    type: object
  workspace.WorkspaceTargetsResponse:
    properties:
      targets:
        items:
          $ref: '#/definitions/workspace.WorkspaceTarget'
        type: array
    type: object
info:
  contact: {}
  title: Memoh API
  version: 1.0.0
paths:
  /acp/profiles:
    get:
      description: List safe ACP profile metadata used by the frontend to render agent
        configuration UI
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acpprofile.ProfilesResponse'
      summary: List ACP profiles
      tags:
      - acp
  /auth/login:
    post:
      description: Validate user credentials and issue a JWT
      parameters:
      - description: Login request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/refresh:
    post:
      description: Issue a new JWT using the existing claims with updated expiration
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh Token
      tags:
      - auth
  /bots:
    get:
      description: List bots accessible to current user (admin can specify owner_id)
      parameters:
      - description: Owner user ID (admin only)
        in: query
        name: owner_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bots.ListBotsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List bots
      tags:
      - bots
    post:
      description: Create a bot user owned by current user (or admin-specified owner)
      parameters:
      - description: Bot payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/bots.CreateBotRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bots.Bot'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Create bot user
      tags:
      - bots
  /bots/{bot_id}/acl/channel-identities:
    get:
      description: Search locally observed channel identities for building ACL rules
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Search query
        in: query
        name: q
        type: string
      - description: Max results
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acl.ChannelIdentityCandidateListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Search ACL channel identity candidates
      tags:
      - bots
  /bots/{bot_id}/acl/channel-identities/{channel_identity_id}/conversations:
    get:
      description: List previously observed conversation candidates for a channel
        identity, for scoped rule building
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Channel Identity ID
        in: path
        name: channel_identity_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acl.ObservedConversationCandidateListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List observed conversations for a channel identity
      tags:
      - bots
  /bots/{bot_id}/acl/channel-types/{channel_type}/conversations:
    get:
      description: List previously observed group/thread conversation candidates for
        a channel type under this bot
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Channel type (e.g. telegram, discord)
        in: path
        name: channel_type
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acl.ObservedConversationCandidateListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List observed conversations for a platform type
      tags:
      - bots
  /bots/{bot_id}/acl/default-effect:
    get:
      description: Get the fallback effect when no rule matches
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acl.DefaultEffectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get bot ACL default effect
      tags:
      - bots
    put:
      description: Set the fallback effect when no rule matches (allow or deny)
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Default effect payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/acl.DefaultEffectResponse'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Set bot ACL default effect
      tags:
      - bots
  /bots/{bot_id}/acl/rules:
    get:
      description: List all ACL rules for a bot
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acl.ListRulesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List bot ACL rules
      tags:
      - bots
    post:
      description: Create a new ACL rule for chat.trigger
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Rule payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/acl.CreateRuleRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/acl.Rule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Create ACL rule
      tags:
      - bots
  /bots/{bot_id}/acl/rules/{rule_id}:
    delete:
      description: Delete an ACL rule by ID
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Rule ID
        in: path
        name: rule_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Delete ACL rule
      tags:
      - bots
    put:
      description: Update an existing ACL rule
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Rule ID
        in: path
        name: rule_id
        required: true
        type: string
      - description: Rule payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/acl.UpdateRuleRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acl.Rule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Update ACL rule
      tags:
      - bots
  /bots/{bot_id}/acp-runtimes:
    post:
      description: Starts an agent runtime before any session exists. The runtime
        ID is server generated; bind it to a session at creation time via acp_runtime_id.
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Runtime spec
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.acpRuntimeCreateRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acpagent.RuntimeStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/apperror.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.Problem'
      summary: Create an unbound ACP runtime (pre-session model picker)
      tags:
      - acp
  /bots/{bot_id}/acp-runtimes/{runtime_id}:
    delete:
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Runtime ID
        in: path
        name: runtime_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.Problem'
      summary: Close an ACP runtime
      tags:
      - acp
    get:
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Runtime ID
        in: path
        name: runtime_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acpagent.RuntimeStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.Problem'
      summary: Get ACP runtime state by runtime ID
      tags:
      - acp
  /bots/{bot_id}/acp-runtimes/{runtime_id}/mode:
    patch:
      description: Sends the selected agent-declared mode ID unchanged to session/set_mode
        before the first chat message binds this runtime to a Session.
      parameters:
      - description: Bot ID
        in: path
        name: bot_id
        required: true
        type: string
      - description: Runtime ID
        in: path
        name: runtime_id
        required: true
        type: string
      - description: Mode selection
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.acpRuntimeModeRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/acpagent.RuntimeStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperror.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.Problem'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/apperror.Problem'
      summary: Set an unbound ACP runtime's mode
