          indistinguishable from "not sent".
        type: string
      chat_runtime:
        type: string
      command_ui_language:
        type: string
      compaction_enabled:
        type: boolean
      compaction_model_id:
        type: string
      compaction_target_percent:
        type: integer
      compaction_threshold:
        type: integer
      default_bot_agent_id:
        type: string
      discuss_probe_model_id:
        type: string
      display_enabled:
        type: boolean
      fetch_provider_id:
        type: string
      image_model_id:
        type: string
      language:
        description: |-
          Language follows the same pointer rule; "" normalizes to DefaultLanguage
          ("auto") rather than clearing the column.
        type: string
      memory_provider_id:
        type: string
      overlay_config:
        additionalProperties: {}
        type: object
      overlay_enabled:
        type: boolean
      overlay_provider:
        type: string
      persist_full_tool_results:
        type: boolean
      reasoning_effort:
        type: string
      search_provider_id:
        type: string
      show_tool_calls_in_im:
        type: boolean
      timezone:
        type: string
      tool_approval_config:
        $ref: '#/definitions/settings.ToolApprovalConfig'
      transcription_model_id:
        type: string
      tts_model_id:
        type: string
      video_model_id:
        type: string
    type: object
  skillpackages.Installation:
    properties:
      bot_id:
        type: string
      id:
        type: string
      installed_at:
        type: string
      package_id:
        type: string
      registry_id:
        type: string
      revision:
        type: string
      updated_at:
        type: string
      workspace_target_id:
        type: string
    required:
    - bot_id
    - id
    - installed_at
    - package_id
    - registry_id
    - revision
    - updated_at
    - workspace_target_id
    type: object
  skills.SafeCatalogItem:
    properties:
      description:
        type: string
      display_name:
        type: string
      name:
        type: string
      source_kind:
        type: string
      state:
        type: string
    type: object
  supermarket.UninstallPackageResponse:
    properties:
      installation:
        $ref: '#/definitions/skillpackages.Installation'
      ok:
        type: boolean
    required:
    - installation
    - ok
    type: object
  userinput.UIAnswer:
    properties:
      custom_text:
        type: string
      question:
        type: string
      question_id:
        type: string
      selected:
        items:
          $ref: '#/definitions/userinput.UIOption'
        type: array
      skipped:
        type: boolean
      text:
        type: string
    type: object
  userinput.UIOption:
    properties:
      description:
        type: string
      id:
        type: string
      label:
        type: string
    type: object
  userinput.UIQuestion:
    properties:
      allow_custom:
        type: boolean
      custom_exclusive:
        type: boolean
      id:
        type: string
      kind:
        type: string
      options:
        items:
          $ref: '#/definitions/userinput.UIOption'
        type: array
      placeholder:
        type: string
      required:
        description: |-
          Required is tri-state for compatibility. Legacy/native ask_user payloads
          omit it and keep their existing surface semantics; ACP forms set it
          explicitly so false means an optional schema property.
        type: boolean
      text:
        type: string
    type: object
  userruntime.CreateRuntimeRequest:
    properties:
      name:
        type: string
    type: object
  userruntime.Runtime:
    properties:
      arch:
        type: string
      capabilities:
        items:
          type: string
        type: array
      client_version:
        type: string
      created_at:
        type: string
      hostname:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
      online:
        type: boolean
      os:
        type: string
      team_id:
        type: string
      workspace_base:
        type: string
    type: object
  video.ConfigSchema:
    properties:
      fields:
        items:
          $ref: '#/definitions/video.FieldSchema'
        type: array
    type: object
  video.FieldSchema:
    properties:
      advanced:
        type: boolean
      description:
        type: string
      enum:
        items:
          type: string
        type: array
      example: {}
      key:
        type: string
      order:
        type: integer
      required:
        type: boolean
      title:
        type: string
      type:
        type: string
    type: object
  video.ImportModelsResponse:
    properties:
      created:
        type: integer
      models:
        items:
          type: string
        type: array
      skipped:
        type: integer
    type: object
  video.ModelInfo:
    properties:
      config_schema:
        $ref: '#/definitions/video.ConfigSchema'
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  video.ModelResponse:
    properties:
      config:
        additionalProperties: {}
        type: object
      created_at:
        type: string
      id:
        type: string
      model_id:
        type: string
      name:
        type: string
      provider_id:
        type: string
      provider_type:
        type: string
      updated_at:
        type: string
    type: object
  video.ProviderMetaResponse:
    properties:
      config_schema:
        $ref: '#/definitions/video.ConfigSchema'
      default_model:
        type: string
      description:
        type: string
      display_name:
        type: string
      models:
        items:
          $ref: '#/definitions/video.ModelInfo'
        type: array
      provider:
        type: string
      supports_list:
        type: boolean
    type: object
  video.ProviderResponse:
    properties:
      client_type:
        type: string
      config:
        additionalProperties: {}
        type: object
      created_at:
        type: string
      enable:
        type: boolean
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  video.UpdateModelRequest:
    properties:
      config:
        additionalProperties: {}
        type: object
      name:
        type: string
    type: object
  webhooktunnel.Status:
    properties:
      enabled:
        type: boolean
      error:
        type: string
      mode:
        type: string
      public_base_url:
        type: string
      status:
        type: string
    type: object
  workdir.CreateRequest:
    properties:
      name:
        type: string
      path:
        type: string
      workspace_target_id:
        type: string
    required:
    - name
    - path
    type: object
  workdir.UpdateRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  workdir.Workdir:
    properties:
      archived:
        type: boolean
      bot_id:
        type: string
      created_at:
        type: string
      created_by_user_id:
        type: string
      id:
        type: string
      name:
        type: string
      path:
        type: string
      target_kind:
        type: string
      updated_at:
        type: string
      workspace_target_id:
        type: string
    type: object
  workdir.WorkdirsResponse:
    properties:
      workdirs:
        items:
          $ref: '#/definitions/workdir.Workdir'
        type: array
    type: object
  workspace.SetPrimaryWorkspaceTargetRequest:
    properties:
      target_id:
        type: string
    required:
    - target_id
    type: object
  workspace.UpdateWorkspaceTargetToolApprovalRequest:
    properties:
      enabled:
        type: boolean
      exec:
        $ref: '#/definitions/settings.ToolApprovalMode'
      read:
        $ref: '#/definitions/settings.ToolApprovalMode'
      tool_approval_config:
