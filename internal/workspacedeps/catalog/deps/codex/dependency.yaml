id: codex
name: Codex
category: agent
icon: openai
description: OpenAI Codex CLI used by the direct Codex runtime.

source: managed
requires: [node]
provides:
  - codex

platforms:
  - { os: linux, arch: [amd64, arm64], libc: glibc }
  - { os: darwin, arch: [arm64] }

version:
  # Must equal protocol.PinnedCodexVersion; enforced by
  # TestWorkspaceDependencyCatalogPinsMatchProtocolSnapshots (WD-CAT-004).
  pin: "0.151.0"

timeouts:
  install: 1200
  remove: 300
  version: 30

scripts:
  install: install.sh
  update: update.sh
  remove: remove.sh
